[build]
  functions = "netlify/functions"

# The confirmation letter reads images/web/logo.png and the Liberation Sans
# files in fonts/ at runtime. The functions bundler does not follow those
# reads, so the files have to be listed here or the deployed function has
# no letterhead and no embedded fonts.
[functions]
  included_files = [
    "images/web/logo.png",
    "fonts/LiberationSans-Regular.ttf",
    "fonts/LiberationSans-Bold.ttf",
    "fonts/LiberationSans-Italic.ttf",
  ]

# Weekdays 16:00 SAST = 14:00 UTC. The function no-ops unless
# LEADS_DIGEST_ENABLED=true, so this schedule is safe to deploy dark.
[functions."leads-digest"]
  schedule = "0 14 * * 1-5"

# Every 15 minutes. Follows approved applications through Spacebring
# (agreement signed, invoice issued, paid) and activates on payment. The
# function no-ops unless SPACEBRING_PROVISIONING=live, so it is safe to
# deploy dark. The same run follows boardroom holds (paid, reminder, lapsed)
# when BOARDROOM_BOOKING=live.
[functions."onboarding-sync"]
  schedule = "*/15 * * * *"

