# Long-cache web-optimized images
[[headers]]
  for = "/images/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible defaults for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The application forms and the staff review tool handle identity documents.
# Keep them out of search indexes and out of caches, and do not leak the
# referrer to third parties.
[[headers]]
  for = "/apply-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"

# The booking page takes personal details and shows a live calendar.
[[headers]]
  for = "/book-boardroom"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/images/campaign/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/web-trailer-720.mp4"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
