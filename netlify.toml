# Extensionless canonical URLs.
# Netlify already serves /slug from slug.html (see /coworking-stellenbosch,
# which has no rewrite). A status-200 rewrite back to the .html file, paired
# with a forced 301 the other way, loops when Pretty URLs or the redirect
# engine evaluates the rewritten path again. The identity rewrites were
# removed for that reason. /index.html goes to /, which is the directory
# index and is not rewritten back to index.html. Rules above this block
# still win, including every /founding-rate* redirect to /your-desk-2027.

[[redirects]]
  from = "/accommodation.html"
  to = "/accommodation"
