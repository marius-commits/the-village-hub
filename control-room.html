<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Village Hub Control Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
:root{--bg:#100f0c;--panel:#191712;--panel2:#211e18;--line:#302b22;--gold:#C9A24B;--gold2:#e0c074;--text:#eee8db;--muted:#9f9787;--green:#65ad70;--orange:#d9a441;--red:#d4654f;--blue:#6f98bd}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{border-right:1px solid var(--line);background:#12100d;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px;border-bottom:1px solid var(--line)}.brand img{width:44px;height:44px;object-fit:contain;background:#000;border-radius:10px;padding:3px}.brand .eyebrow{color:var(--gold);font-size:10px;letter-spacing:2.2px;text-transform:uppercase}.brand h1{font-size:16px;margin:4px 0 0}.nav{padding:18px 0;display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}.nav button:hover{background:var(--panel);color:var(--text)}.nav button.active{background:rgba(201,162,75,.12);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(201,162,75,.22)}.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}.nav button.active .dot{background:var(--gold)}.sidefoot{margin-top:auto;padding:14px 10px 4px;color:var(--muted);font-size:11px;line-height:1.6}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5;background:rgba(16,15,12,.93);backdrop-filter:blur(14px)}.topbar h2{margin:0;font-size:17px}.spacer{flex:1}.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.status i{width:8px;height:8px;border-radius:50%;background:var(--orange)}.status i.ok{background:var(--green)}.action{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:9px;margin-left:12px;cursor:pointer}.action.primary{border-color:rgba(201,162,75,.45);color:var(--gold2)}.content{padding:26px 28px 60px;max-width:1450px;margin:0 auto}.hero{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px}.hero h3{font-size:27px;margin:0 0 5px}.hero p{color:var(--muted);margin:0;font-size:13px}.hero .date{margin-left:auto;color:var(--muted);font-size:12px}.kpis{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;margin-bottom:22px}.kpi{background:linear-gradient(180deg,var(--panel),#171510);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-height:100px}.kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:750;margin-top:9px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}.kpi.alert .value{color:var(--orange)}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;overflow:hidden}.card h4{margin:0 0 14px;font-size:13px;letter-spacing:.5px}.card .hint{color:var(--muted);font-size:11px;margin-top:-7px;margin-bottom:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:11px 9px;border-bottom:1px solid rgba(48,43,34,.65);font-size:12px;vertical-align:top}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(111,152,189,.13);color:var(--blue)}.badge.good{color:var(--green);background:rgba(101,173,112,.13)}.badge.warn{color:var(--orange);background:rgba(217,164,65,.13)}.badge.bad{color:var(--red);background:rgba(212,101,79,.13)}.badge.gold{color:var(--gold2);background:rgba(201,162,75,.12)}.stack{display:grid;gap:9px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}.item .row{display:flex;gap:10px;align-items:center}.item strong{font-size:12px}.item small{color:var(--muted);font-size:11px}.item .body{margin-top:7px;font-size:12px;line-height:1.45;color:#d9d2c5}.sectionTitle{margin:4px 0 14px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1.6px}.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.loginbrand{display:flex;gap:13px;align-items:center;margin-bottom:24px}.loginbrand img{width:48px;height:48px;background:#000;border-radius:10px;padding:3px}.loginbox h1{font-size:22px;margin:0}.loginbox p{color:var(--muted);font-size:13px;line-height:1.55}.field{display:grid;gap:7px;margin:20px 0}.field label{font-size:11px;color:var(--muted)}.field input{border:1px solid var(--line);background:#11100d;color:var(--text);padding:12px;border-radius:10px;outline:none}.field input:focus{border-color:var(--gold)}.loginbox button{width:100%;border:1px solid var(--gold);background:var(--gold);color:#15120b;font-weight:750;padding:12px;border-radius:10px;cursor:pointer}.msg{font-size:12px;margin-top:12px;color:var(--gold2)}.toggle{width:40px;height:22px;border-radius:20px;border:1px solid var(--line);background:#2d2922;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#776f60;top:2px;left:3px;transition:.2s}.toggle.on{background:rgba(101,173,112,.25);border-color:rgba(101,173,112,.4)}.toggle.on:after{left:19px;background:var(--green)}.chartbox{height:280px}.mobileNav{display:none}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:760px){.shell{display:block}.sidebar{display:none}.topbar{height:64px;padding:0 16px}.content{padding:18px 14px 85px}.kpis{grid-template-columns:repeat(2,1fr)}.kpi .value{font-size:23px}.hero h3{font-size:23px}.hero .date{display:none}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#12100df5;border-top:1px solid var(--line);z-index:10;padding:7px;overflow-x:auto}.mobileNav button{flex:1;min-width:65px;border:0;background:transparent;color:var(--muted);font-size:9px;padding:8px 4px}.mobileNav button.active{color:var(--gold)}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="loginbrand"><img src="/images/web/logo.png" alt=""><div><div style="color:var(--gold);font-size:10px;letter-spacing:2px">THE VILLAGE HUB</div><h1>Control Room</h1></div></div><p>Private operations console for bookings, guest communication, leads, feedback, marketing attribution and system health.</p><form id="loginForm"><div class="field"><label>Authorised email</label><input id="email" type="email" autocomplete="email" placeholder="you@villagehub.co.za" required></div><button type="submit">Send secure sign-in link</button></form><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><img src="/images/web/logo.png" alt=""><div><div class="eyebrow">The Village Hub</div><h1>Control Room</h1></div></div><nav class="nav" id="nav"><button data-view="today" class="active"><span class="dot"></span>Today</button><button data-view="bookings"><span class="dot"></span>Bookings</button><button data-view="messages"><span class="dot"></span>Messages</button><button data-view="experience"><span class="dot"></span>Experience</button><button data-view="leads"><span class="dot"></span>Leads</button><button data-view="marketing"><span class="dot"></span>Marketing</button><button data-view="automations"><span class="dot"></span>Automations</button><button data-view="system"><span class="dot"></span>System health</button></nav><div class="sidefoot"><div id="sideUser">—</div><div>Live operating layer · internal only</div></div></aside><main class="main"><header class="topbar"><h2 id="pageTitle">Today</h2><div class="spacer"></div><div class="status"><i id="healthDot"></i><span id="healthText">Checking systems</span></div><button class="action" id="refreshBtn">↻ Refresh</button><button class="action primary" id="logoutBtn">Sign out</button></header><div class="content" id="content"></div></main></div><div id="mobileNav" class="mobileNav hidden"></div>
<script>
const money=n=>'R'+(Number(n)||0).toLocaleString('en-ZA',{maximumFractionDigits:0}),num=n=>(Number(n)||0).toLocaleString('en-ZA',{maximumFractionDigits:1}),when=v=>v?new Date(v).toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg',dateStyle:'medium',timeStyle:'short'}):'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s='')=>{const x=String(s).toLowerCase(),c=/sent|read|delivered|confirmed|won|ok|resolved|active/.test(x)?'good':/failed|dead|lost|error|canceled/.test(x)?'bad':/queued|new|open|processing|warning|in_progress/.test(x)?'warn':'gold';return `<span class="badge ${c}">${esc(s)}</span>`};let sb,cfg,session,currentView='today',summary={},charts={};
async function boot(){cfg=await fetch('/.netlify/functions/control-room-config',{cache:'no-store'}).then(r=>r.json()).catch(()=>({enabled:false}));if(!cfg.enabled){document.getElementById('loginMsg').textContent='Control Room backend is not connected yet.';return}sb=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true}});const {data:{session:s}}=await sb.auth.getSession();session=s;sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s)showApp()});if(session)showApp()}
async function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('mobileNav').classList.remove('hidden');document.getElementById('sideUser').textContent=session.user.email;buildMobileNav();await loadView(currentView)}
async function api(view,opts={}){const token=(await sb.auth.getSession()).data.session?.access_token,url=new URL(`${cfg.supabaseUrl}/functions/v1/${cfg.apiFunction}`);if(view)url.searchParams.set('view',view);Object.entries(opts.params||{}).forEach(([k,v])=>url.searchParams.set(k,v));const res=await fetch(url,{method:opts.method||'GET',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:opts.body?JSON.stringify(opts.body):undefined});if(res.status===403)throw new Error('This email is not on the Control Room admin list.');const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');return data}
function setNav(view){currentView=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={today:'Today',bookings:'Bookings',messages:'Message Centre',experience:'Guest Experience',leads:'Lead Pipeline',marketing:'Marketing & Attribution',automations:'Automations',system:'System Health'};document.getElementById('pageTitle').textContent=titles[view]||view}
async function loadView(view){setNav(view);const c=document.getElementById('content');c.innerHTML='<div class="empty">Loading…</div>';try{if(view==='today')await renderToday(c);if(view==='bookings')await renderBookings(c);if(view==='messages')await renderMessages(c);if(view==='experience')await renderExperience(c);if(view==='leads')await renderLeads(c);if(view==='marketing')await renderMarketing(c);if(view==='automations')await renderAutomations(c);if(view==='system')await renderSystem(c)}catch(e){c.innerHTML=`<div class="empty"><strong>Could not load this view</strong>${esc(e.message)}</div>`}}
function kpi(label,value,sub,cls=''){return `<div class="kpi ${cls}"><div class="label">${label}</div><div class="value">${esc(value)}</div><div class="sub">${sub}</div></div>`}
function bookingsTable(rows){if(!rows.length)return '<div class="empty">No bookings in this window.</div>';return `<table class="table"><thead><tr><th>Time</th><th>Guest</th><th>Resource</th><th>Status</th><th>Payment</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${when(x.start_at)}<br><small style="color:var(--muted)">to ${new Date(x.end_at).toLocaleTimeString('en-ZA',{timeZone:'Africa/Johannesburg',hour:'2-digit',minute:'2-digit'})}</small></td><td><strong>${esc([x.contact?.first_name,x.contact?.last_name].filter(Boolean).join(' ')||'Unknown')}</strong><br><small>${esc(x.contact?.company_name||x.contact?.phone_e164||'')}</small></td><td>${esc(x.resource_name||x.booking_title||x.resource_type||'—')}</td><td>${badge(x.status)}</td><td>${badge(x.payment_status||'—')}</td></tr>`).join('')}</tbody></table>`}
function messagesTable(rows){if(!rows.length)return '<div class="empty">No message activity yet.</div>';return `<table class="table"><thead><tr><th>When</th><th>Customer</th><th>Message</th><th>Direction</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${when(x.created_at)}</td><td>${esc([x.contact?.first_name,x.contact?.last_name].filter(Boolean).join(' ')||x.contact?.phone_e164||'Unknown')}</td><td><strong>${esc(x.template_key||x.body_preview||'WhatsApp')}</strong><br><small style="color:var(--muted)">${esc(x.booking?.resource_name||'')}</small></td><td>${esc(x.direction)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table>`}
async function renderToday(c){const [s,b,m,f,l]=await Promise.all([api('summary'),api('bookings',{params:{limit:12}}),api('messages',{params:{limit:8}}),api('feedback',{params:{limit:5}}),api('leads',{params:{limit:5}})]);summary=s.data||{};const bad=(summary.messages_failed||0)>0;document.getElementById('healthDot').className=bad?'':'ok';document.getElementById('healthText').textContent=bad?'Needs attention':'Systems healthy';c.innerHTML=`<div class="hero"><div><h3>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}.</h3><p>One view of what is happening across The Village Hub right now.</p></div><div class="date">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="kpis">${kpi('Bookings today',summary.bookings_today||0,'Spacebring')}${kpi('In the Hub now',summary.in_progress||0,'active bookings')}${kpi('Messages queued',summary.messages_queued||0,'WhatsApp jobs')}${kpi('New leads',summary.new_leads||0,'need attention',summary.new_leads?'alert':'')}${kpi('Open feedback',summary.open_feedback||0,'service recovery',summary.open_feedback?'alert':'')}${kpi('Message failures',summary.messages_failed||0,'exceptions',summary.messages_failed?'alert':'')}</div><div class="grid2"><div class="card"><h4>Upcoming & active bookings</h4><div class="tablewrap">${bookingsTable(b.data||[])}</div></div><div class="card"><h4>Attention queue</h4><div class="hint">Leads and guest feedback that need a human.</div><div class="stack">${(l.data||[]).filter(x=>x.status==='new').slice(0,3).map(leadItem).join('')||'<div class="empty">No untouched leads.</div>'}${(f.data||[]).filter(x=>x.needs_follow_up&&x.follow_up_status!=='resolved').slice(0,3).map(feedbackItem).join('')}</div></div></div><h3 class="sectionTitle" style="margin-top:22px">Recent communication</h3><div class="card"><div class="tablewrap">${messagesTable(m.data||[])}</div></div>`}
async function renderBookings(c){const r=await api('bookings',{params:{limit:150}});c.innerHTML=`<div class="hero"><div><h3>Bookings</h3><p>Live operational booking view sourced from Spacebring.</p></div></div><div class="card"><div class="tablewrap">${bookingsTable(r.data||[])}</div></div>`}
function queueTable(rows){if(!rows.length)return '<div class="empty">Queue is clear.</div>';return `<table class="table"><thead><tr><th>Due</th><th>Customer</th><th>Template</th><th>Attempts</th><th>Status</th><th>Error</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${when(x.due_at)}</td><td>${esc([x.contact?.first_name,x.contact?.last_name].filter(Boolean).join(' ')||x.contact?.phone_e164||'—')}</td><td>${esc(x.template_key)}</td><td>${x.attempts}/${x.max_attempts}</td><td>${badge(x.status)}</td><td>${esc(x.last_error||'')}</td></tr>`).join('')}</tbody></table>`}
async function renderMessages(c){const r=await api('messages',{params:{limit:150}});c.innerHTML=`<div class="hero"><div><h3>Message Centre</h3><p>Every automated WhatsApp, its delivery state and every reply.</p></div></div><div class="kpis">${kpi('Queued',(r.queue||[]).filter(x=>x.status==='queued').length,'waiting to send')}${kpi('Processing',(r.queue||[]).filter(x=>x.status==='processing').length,'in flight')}${kpi('Failed',(r.queue||[]).filter(x=>['failed','dead_letter'].includes(x.status)).length,'needs review')}</div><div class="card"><h4>Message audit trail</h4><div class="tablewrap">${messagesTable(r.data||[])}</div></div><h3 class="sectionTitle" style="margin-top:22px">Queue & exceptions</h3><div class="card"><div class="tablewrap">${queueTable(r.queue||[])}</div></div>`}
function feedbackItem(x){return `<div class="item"><div class="row"><strong>${esc([x.contact?.first_name,x.contact?.last_name].filter(Boolean).join(' ')||'Guest')}</strong>${badge(x.follow_up_status)}<span style="margin-left:auto"><small>${when(x.created_at)}</small></span></div><div class="body">${esc(x.message||'No written feedback')}</div>${x.needs_follow_up&&x.follow_up_status!=='resolved'?`<button class="action" style="margin:10px 0 0" onclick="resolveFeedback('${x.id}')">Mark resolved</button>`:''}</div>`}
async function renderExperience(c){const r=await api('feedback',{params:{limit:100}}),rows=r.data||[];c.innerHTML=`<div class="hero"><div><h3>Guest Experience</h3><p>Feedback, service recovery and review follow-up in one place.</p></div></div><div class="kpis">${kpi('Feedback items',rows.length,'recent')}${kpi('Needs follow-up',rows.filter(x=>x.needs_follow_up&&x.follow_up_status!=='resolved').length,'open actions')}${kpi('Resolved',rows.filter(x=>x.follow_up_status==='resolved').length,'closed loop')}</div><div class="stack">${rows.length?rows.map(feedbackItem).join(''):'<div class="empty">No feedback replies yet.</div>'}</div>`}
async function resolveFeedback(id){await patch('feedback',id,{follow_up_status:'resolved',needs_follow_up:false,resolved_at:new Date().toISOString()});loadView('experience')}
function leadsTable(rows){if(!rows.length)return '<div class="empty">No leads yet.</div>';return `<table class="table"><thead><tr><th>Received</th><th>Lead</th><th>Interest</th><th>Source</th><th>Campaign</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${when(x.created_at)}</td><td><strong>${esc([x.first_name,x.last_name].filter(Boolean).join(' ')||'Unknown')}</strong><br><small>${esc(x.phone_e164||x.email||'')}</small></td><td>${esc(x.interest||'—')}</td><td>${esc(x.source)}</td><td>${esc(x.campaign_name||x.utm_campaign||'—')}</td><td>${badge(x.status)}</td><td><select onchange="leadStatus('${x.id}',this.value)" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px"><option value="">Move…</option>${['new','contacted','tour_booked','proposal','won','lost','spam'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`}
async function renderLeads(c){const r=await api('leads',{params:{limit:150}}),rows=r.data||[];c.innerHTML=`<div class="hero"><div><h3>Lead Pipeline</h3><p>Website and paid-media enquiries, from first touch to booking.</p></div></div><div class="kpis">${kpi('New',rows.filter(x=>x.status==='new').length,'uncontacted')}${kpi('Contacted',rows.filter(x=>x.status==='contacted').length,'in conversation')}${kpi('Tours',rows.filter(x=>x.status==='tour_booked').length,'booked')}${kpi('Won',rows.filter(x=>x.status==='won').length,'converted')}</div><div class="card"><div class="tablewrap">${leadsTable(rows)}</div></div>`}
async function leadStatus(id,status){if(!status)return;await patch('lead',id,{status,first_response_at:status!=='new'?new Date().toISOString():null});loadView('leads')}
async function renderMarketing(c){const r=await api('marketing',{params:{days:90}}),rows=r.data||[],by={};rows.forEach(x=>{const k=x.campaign_id;by[k]??={name:x.campaign_name,cost:0,clicks:0,impr:0,conv:0,val:0};by[k].cost+=Number(x.cost||0);by[k].clicks+=Number(x.clicks||0);by[k].impr+=Number(x.impressions||0);by[k].conv+=Number(x.conversions||0);by[k].val+=Number(x.conversion_value||0)});const camps=Object.values(by),totals=camps.reduce((a,x)=>({cost:a.cost+x.cost,clicks:a.clicks+x.clicks,impr:a.impr+x.impr,conv:a.conv+x.conv}),{cost:0,clicks:0,impr:0,conv:0});c.innerHTML=`<div class="hero"><div><h3>Marketing & Attribution</h3><p>Ad spend becomes useful when it is connected to enquiries, bookings and revenue.</p></div></div>${rows.length?`<div class="kpis">${kpi('Spend · 90d',money(totals.cost),'Google Ads')}${kpi('Clicks',num(totals.clicks),'paid search')}${kpi('Conversions',num(totals.conv),'Google Ads')}${kpi('Cost / conversion',totals.conv?money(totals.cost/totals.conv):'—','blended')}</div><div class="grid2"><div class="card"><h4>Spend & conversions</h4><div class="chartbox"><canvas id="marketingChart"></canvas></div></div><div class="card"><h4>Campaigns</h4><div class="stack">${camps.map(x=>`<div class="item"><div class="row"><strong>${esc(x.name)}</strong><span style="margin-left:auto">${badge(`${num(x.conv)} conv`)}</span></div><div class="body">${money(x.cost)} spend · ${num(x.clicks)} clicks · ${x.conv?money(x.cost/x.conv):'—'} / conversion</div></div>`).join('')}</div></div>`:'<div class="card"><div class="empty"><strong>Marketing sync is ready for credentials</strong>Once Google Ads OAuth credentials are added to the Village Hub backend, campaign data will populate here automatically.</div></div>'}`;if(rows.length)drawMarketing(rows)}
function drawMarketing(rows){const by={};rows.forEach(x=>{by[x.metric_date]??={cost:0,conv:0};by[x.metric_date].cost+=Number(x.cost||0);by[x.metric_date].conv+=Number(x.conversions||0)});const labels=Object.keys(by).sort();charts.marketing?.destroy();charts.marketing=new Chart(document.getElementById('marketingChart'),{type:'bar',data:{labels,datasets:[{label:'Spend (R)',data:labels.map(d=>by[d].cost),yAxisID:'y'},{label:'Conversions',data:labels.map(d=>by[d].conv),type:'line',yAxisID:'y1'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:'#9f9787',maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:'#9f9787'},grid:{color:'#302b22'}},y1:{position:'right',ticks:{color:'#9f9787'},grid:{display:false}}},plugins:{legend:{labels:{color:'#eee8db'}}}}})}
async function renderAutomations(c){const r=await api('automations'),rows=r.data||[];c.innerHTML=`<div class="hero"><div><h3>Automations</h3><p>Every journey has an explicit rule, timing and audit trail.</p></div></div><div class="stack">${rows.map(x=>`<div class="item"><div class="row"><div class="toggle ${x.enabled?'on':''}" onclick="toggleRule('${x.id}',${!x.enabled})"></div><strong>${esc(x.rule_key.replaceAll('_',' '))}</strong><span style="margin-left:auto">${badge(x.enabled?'active':'paused')}</span></div><div class="body">Delay: ${x.delay_minutes} min · Cooldown: ${x.cooldown_days} days<br><small>${esc(JSON.stringify(x.config_json))}</small></div></div>`).join('')}</div>`}
async function toggleRule(id,enabled){await patch('automation',id,{enabled});loadView('automations')}
async function renderSystem(c){const r=await api('health'),rows=r.data||[];c.innerHTML=`<div class="hero"><div><h3>System Health</h3><p>Webhook freshness, dispatchers, syncs and exceptions.</p></div></div><div class="stack">${rows.length?rows.map(x=>`<div class="item"><div class="row"><strong>${esc(x.key)}</strong><span style="margin-left:auto">${badge(x.status)}</span></div><div class="body">Last OK: ${when(x.last_ok_at)} · Last event: ${when(x.last_event_at)}<br><small>${esc(JSON.stringify(x.details||{}))}</small></div></div>`).join(''):'<div class="empty">No health signals yet. They appear as integrations start receiving traffic.</div>'}</div>${(r.failed_messages||[]).length?`<h3 class="sectionTitle" style="margin-top:22px">Dead letters / failures</h3><div class="card"><div class="tablewrap">${queueTable(r.failed_messages)}</div></div>`:''}`}
async function patch(resource,id,p){return api('',{method:'PATCH',body:{resource,id,patch:p}})}function leadItem(x){return `<div class="item"><div class="row"><strong>${esc([x.first_name,x.last_name].filter(Boolean).join(' ')||'New lead')}</strong>${badge(x.status)}<span style="margin-left:auto"><small>${when(x.created_at)}</small></span></div><div class="body">${esc(x.interest||x.message||x.source)}</div></div>`}
function buildMobileNav(){const views=[['today','Today'],['bookings','Bookings'],['messages','Messages'],['leads','Leads'],['experience','Feedback'],['system','System']];document.getElementById('mobileNav').innerHTML=views.map(([v,l])=>`<button data-view="${v}" class="${v===currentView?'active':''}">${l}</button>`).join('');document.querySelectorAll('#mobileNav [data-view]').forEach(b=>b.onclick=()=>loadView(b.dataset.view))}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)loadView(b.dataset.view)});document.getElementById('refreshBtn').onclick=()=>loadView(currentView);document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();if(!sb){document.getElementById('loginMsg').textContent='Control Room backend is not connected yet.';return}const email=document.getElementById('email').value.trim();document.getElementById('loginMsg').textContent='Sending secure link…';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/control-room'}});document.getElementById('loginMsg').textContent=error?error.message:'Check your email for the secure sign-in link.'};boot();
</script></body></html>
