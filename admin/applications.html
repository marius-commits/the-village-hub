<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications | The Village Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Design tokens and base components only. vh.js is deliberately NOT loaded:
       the public nav, footer, page transitions and WhatsApp nudge do not belong
       on a staff tool that displays identity documents. -->
  <link rel="stylesheet" href="/assets/vh.css?v=3">
  <script src="/assets/vh-admin-auth.js?v=3"></script>
  <style>
    body{ background:var(--vh-linen); font-family:var(--vh-sans); }
    .btn{ border-radius:999px; font-weight:600; font-size:14px; padding:.6rem 1.2rem; }
    .btn:disabled{ opacity:.5; cursor:not-allowed; }
    .btn-sage{ background:var(--vh-sage); color:#fff; }
    .btn-brown{ background:var(--vh-bark); color:#fff; }
    .btn-ghost{ background:#fff; color:var(--vh-bark); border:1px solid var(--vh-sand); }
    .btn-danger{ background:#fff; color:#b03a2b; border:1px solid #e8c4bd; }
    .card{ background:#fff; border:1px solid var(--vh-sand); border-radius:12px; }
    .field{ padding:.6rem .85rem; font-size:14px; border-radius:.6rem; }
    .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:99px; }
    .s-submitted    { background:#eef3e4; color:#5c6b36; }
    .s-under_review { background:#e7eefb; color:#2f5597; }
    .s-info_requested{ background:#fdf3e0; color:#8a6116; }
    .s-approved     { background:#e6f4ea; color:#1e7c3a; }
    .s-activated    { background:#6B4423; color:#fff; }
    /* Onboarding progress */
    .prog-track { height:6px; border-radius:99px; background:#E8D9C5; overflow:hidden; }
    .prog-fill  { height:100%; border-radius:99px; background:#8A9A5B; transition:width .3s; }
    .prog-fill.warn { background:#B4472E; }
    .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:6px; }
    .step { position:relative; padding-top:14px; font-size:11px; line-height:1.3; color:#8b8176; }
    .step::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; border-radius:99px; background:#E8D9C5; }
    .step.done { color:#2A2118; font-weight:600; }
    .step.done::before { background:#8A9A5B; }
    .step.current { color:#6B4423; font-weight:700; }
    .step.current::before { background:#C9A24B; }
    .step.stuck::before { background:#B4472E; }
    .step small { display:block; font-weight:400; color:#8b8176; margin-top:1px; }
    .tick { display:flex; align-items:center; gap:.35rem; font-size:12px; font-weight:600; color:#6F6355; white-space:nowrap; }
    .tick input { width:16px; height:16px; accent-color:#8A9A5B; }
    .tick.on { color:#1e7c3a; }
    .s-declined     { background:#fbeae7; color:#b03a2b; }
    .s-withdrawn    { background:#eee; color:#777; }
    .row{ cursor:pointer; border-left:3px solid transparent; }
    .row:hover{ background:#fbf9f6; }
    .row.sel{ background:#f6f2ec; border-left-color:var(--vh-bark); }
    .tab{ padding:.5rem .9rem; border-radius:999px; font-size:14px; font-weight:600; color:var(--vh-bark); text-decoration:none; }
    .tab.on{ background:var(--vh-bark); color:#fff; }
    [hidden]{ display:none !important; }

    /* ---- phone layout ----
       One pane at a time below 1024px: the queue, or one application. On a
       wide screen both sit side by side as before. */
    .chips{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px; }
    .chips::-webkit-scrollbar{ display:none; }
    .chip{ flex:none; padding:.5rem .85rem; border-radius:999px; font-size:13px; font-weight:600; color:var(--vh-bark); background:#fff; border:1px solid var(--vh-sand); white-space:nowrap; }
    .chip.on{ background:var(--vh-bark); border-color:var(--vh-bark); color:#fff; }
    .chip b{ font-weight:700; opacity:.7; margin-left:.3rem; }
    .flag{ display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
    .flag-age{ background:#fdf3e0; color:#8a6116; }
    .flag-dup{ background:#fbeae7; color:#b03a2b; }
    .flag-reg{ background:#f6efdc; color:#8a6116; }
    .contact{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .contact a{ display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:12px; font-size:14px; font-weight:600; text-decoration:none; background:#fff; color:var(--vh-bark); border:1px solid var(--vh-sand); }
    .contact a.wa{ background:#e9f8ef; border-color:#bfe8cf; color:#12703a; }
    .backbar{ display:none; }
    @media (min-width:1024px){ .chips{ flex-wrap:wrap; margin:0; padding:0; } .contact{ max-width:420px; } }
    @media (max-width:1023px){
      body.viewing #queuePane{ display:none; }
      body:not(.viewing) #detail{ display:none; }
      .backbar{ display:flex; align-items:center; gap:.4rem; position:sticky; top:56px; z-index:30; margin:-1rem -1rem 1rem; padding:.7rem 1rem; background:#fff; border-bottom:1px solid var(--vh-sand); border-radius:12px 12px 0 0; font-size:14px; font-weight:700; color:var(--vh-bark); width:calc(100% + 2rem); text-align:left; }
      .field{ font-size:16px; }               /* stops iOS zooming on focus */
      .btn{ min-height:44px; }
      .tab{ padding:.45rem .7rem; font-size:13px; }
      .row{ padding-top:.9rem; padding-bottom:.9rem; }
      .tick{ font-size:13px; min-height:44px; }
      .tick input{ width:22px; height:22px; }
    }
    @media (max-width:639px){
      .steps{ grid-template-columns:1fr 1fr; gap:10px 8px; }
      .step{ font-size:12px; }
    }
  </style>
</head>
<body class="font-sans antialiased text-gray-800">

<!-- ===== LOGIN ===== -->
<div id="login" class="min-h-screen flex items-center justify-center px-4">
  <div class="card p-8 w-full max-w-sm">
    <div class="flex items-center mb-6">
      <img class="h-10 w-10 object-contain" src="/images/web/logo.png" alt="">
      <span class="ml-3 font-bold text-[#6B4423] font-display">The Village Hub</span>
    </div>
    <h1 class="text-xl font-extrabold text-gray-900 font-display">Applications</h1>
    <p class="text-sm text-gray-600 mt-1 mb-5">Staff only. We email you a one-time sign-in code, then this device stays signed in.</p>
    <div id="step-email">
      <label class="block text-xs font-semibold text-gray-700 mb-1" for="loginEmail">Work email</label>
      <input class="field" id="loginEmail" type="email" placeholder="you@villagehub.co.za" autocomplete="email">
      <button class="btn btn-sage w-full mt-4" id="sendLink">Email me a code</button>
    </div>
    <div id="step-code" hidden>
      <label class="block text-xs font-semibold text-gray-700 mb-1" for="loginCode">Enter the code</label>
      <input class="field text-center text-lg" style="letter-spacing:.4em" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="--------">
      <button class="btn btn-sage w-full mt-4" id="verifyCode">Sign in</button>
      <button class="text-xs text-[#6B4423] underline mt-3 mx-auto block" id="resend" type="button">Use a different email</button>
    </div>
    <p class="text-sm mt-4" id="loginMsg"></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="bg-white border-b border-[#E8D9C5] sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center shrink-0">
        <img class="h-8 w-8 object-contain" src="/images/web/logo.png" alt="">
        <span class="ml-2 font-bold text-[#6B4423] text-sm font-display hidden sm:inline">Admin</span>
      </div>
      <nav class="flex items-center gap-1 min-w-0">
        <a class="tab" href="/admin">Today</a>
        <span class="tab on">Applications</span>
        <a class="tab" href="/admin/leads">Leads</a>
      </nav>
      <div class="flex items-center gap-3 shrink-0">
        <span class="text-xs text-gray-500 hidden md:inline" id="whoami"></span>
        <button class="text-xs text-[#6B4423] underline whitespace-nowrap py-2" id="signout">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6 grid lg:grid-cols-[380px_1fr] gap-5 items-start">

    <!-- queue -->
    <section id="queuePane" class="min-w-0">
      <input class="field" id="search" type="search" placeholder="Search name, company or reference" autocomplete="off" enterkeyhint="search">
      <div class="chips mt-2 mb-3" id="chips"></div>
      <div class="card overflow-hidden">
        <div class="px-4 py-3 border-b border-[#E8D9C5] flex items-center justify-between">
          <span class="text-sm font-bold text-gray-900">Queue</span>
          <span class="flex items-center gap-3">
            <span class="text-xs text-gray-500" id="count"></span>
            <button class="text-xs font-semibold text-[#6B4423] underline py-1" id="refresh" type="button">Refresh</button>
          </span>
        </div>
        <!-- The list scrolls with the page on a phone. Only the wide layout
             needs its own scroll box, to keep the detail pane in view. -->
        <div id="list" class="divide-y divide-[#F0EAE1] lg:max-h-[68vh] lg:overflow-y-auto"></div>
      </div>
    </section>

    <!-- detail -->
    <section id="detail" class="card p-8 text-center text-gray-500 text-sm min-w-0">
      Choose an application from the queue.
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';
  const Auth = window.VHAdminAuth;

  const $ = s => document.querySelector(s);
  let currentId = null, cache = {};

  const DOC_LABELS = {
    cipc_certificate:'CIPC certificate', director_id:'Director ID',
    proof_of_address:'Proof of address', registered_address_mandate:'Registered address mandate',
    student_card:'Student card', proof_of_registration:'Proof of registration', other:'Other document'
  };
  const STATUS_LABELS = {
    submitted:'Submitted', under_review:'Under review', info_requested:'Waiting on applicant',
    approved:'Approved', activated:'Activated', declined:'Declined', withdrawn:'Withdrawn'
  };
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = d => d ? new Date(d).toLocaleString('en-ZA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';

  // ---- auth ----
  // The session itself lives in /assets/vh-admin-auth.js: refresh token kept
  // and rotated, so signing in is a once-a-month event rather than a daily tax.
  let pendingEmail = null;

  function showLogin(message){
    $('#app').hidden = true; $('#login').hidden = false;
    $('#step-code').hidden = true; $('#step-email').hidden = false;
    $('#loginMsg').className = 'text-sm mt-4 ' + (message ? 'text-red-700' : 'text-gray-700');
    $('#loginMsg').textContent = message || '';
  }

  function bootApp(){
    $('#login').hidden = true;
    $('#app').hidden = false;
    loadQueue().catch(err => showLogin(err && err.code === 'pending'
      ? err.message
      : err && err.authRequired
      ? 'That session has ended. Sign in again.'
      : 'Could not load the queue. Reload the page.'));
  }

  $('#sendLink').addEventListener('click', async () => {
    const email = $('#loginEmail').value.trim();
    const msg = $('#loginMsg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.className='text-sm mt-4 text-red-700'; msg.textContent='That email does not look right.'; return; }
    $('#sendLink').disabled = true;
    msg.className='text-sm mt-4 text-gray-600'; msg.textContent='Sending…';
    try{
      await Auth.requestCode(email);
      pendingEmail = email;
      $('#step-email').hidden = true; $('#step-code').hidden = false;
      msg.className='text-sm mt-4 text-gray-700';
      msg.textContent='We emailed a sign-in code to ' + email + '. It is a number — there is no link to click.';
      const c = $('#loginCode'); if(c) c.focus();
    }catch(e){
      msg.className='text-sm mt-4 text-red-700';
      msg.textContent = e.message || 'Could not send that code.';
    }finally{
      $('#sendLink').disabled = false;
    }
  });

  async function verifyCode(){
    const code = ($('#loginCode').value||'').replace(/\s/g,'');
    const msg = $('#loginMsg');
    if(!/^\d{6,8}$/.test(code)){ msg.className='text-sm mt-4 text-red-700'; msg.textContent='Enter the code from the email.'; return; }
    $('#verifyCode').disabled = true;
    msg.className='text-sm mt-4 text-gray-600'; msg.textContent='Checking…';
    try{
      await Auth.verifyCode(pendingEmail, code);
      msg.textContent='';
      bootApp();
    }catch(e){
      msg.className='text-sm mt-4 text-red-700';
      msg.textContent = (e.message || 'That code did not work') + '. Check it, or resend.';
    }finally{
      $('#verifyCode').disabled = false;
    }
  }
  $('#verifyCode').addEventListener('click', verifyCode);
  $('#loginCode').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); verifyCode(); } });
  $('#resend').addEventListener('click', () => { $('#step-code').hidden=true; $('#step-email').hidden=false; $('#loginCode').value=''; $('#loginMsg').textContent=''; });

  $('#signout').addEventListener('click', () => { Auth.signOut(); location.reload(); });

  async function api(path, options){
    try{
      return await Auth.api(path, options);
    }catch(e){
      if(e && e.code === 'pending'){ showLogin(e.message); return null; }
      if(e && e.authRequired){ showLogin('Your session has ended. Sign in again.'); return null; }
      throw e;
    }
  }

  // ---- queue ----
  // The open queue is fetched once and filtered here, so switching between
  // New / In review / Approved is instant and each chip can show its count.
  // Activated and Declined are history, fetched only when asked for.
  const CHIPS = [
    ['', 'Open'], ['submitted', 'New'], ['under_review', 'In review'],
    ['info_requested', 'Waiting on applicant'], ['approved', 'Approved'],
    ['activated', 'Activated'], ['declined', 'Declined']
  ];
  const HISTORY = ['activated', 'declined'];
  let view = '', all = [], openCounts = null, lastLoad = 0, queueScroll = 0;

  const days = d => Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
  const isPhone = () => window.matchMedia('(max-width:1023px)').matches;

  async function loadQueue(){
    const server = HISTORY.includes(view) ? view : '';
    const data = await api('staff-applications' + (server ? '?status=' + server : ''));
    if(!data) return;
    if(data.staff) $('#whoami').textContent = data.staff.email;
    all = data.applications || [];
    lastLoad = Date.now();
    if(!server){
      openCounts = { '': all.length };
      all.forEach(a => { openCounts[a.status] = (openCounts[a.status] || 0) + 1; });
    }
    renderQueue();
  }

  function renderQueue(){
    $('#chips').innerHTML = CHIPS.map(([key, label]) => {
      const n = openCounts && !HISTORY.includes(key) ? (openCounts[key] || 0) : null;
      return `<button type="button" class="chip ${view === key ? 'on' : ''}" data-view="${key}">${label}${n === null ? '' : `<b>${n}</b>`}</button>`;
    }).join('');

    // The same person applying twice is easy to miss in a list. Same email,
    // more than one application in view: say so on each.
    const byEmail = {};
    all.forEach(a => { const k = (a.email || '').trim().toLowerCase(); if(k) (byEmail[k] = byEmail[k] || []).push(a); });

    const q = $('#search').value.trim().toLowerCase();
    const apps = all.filter(a => {
      if(view && !HISTORY.includes(view) && a.status !== view) return false;
      if(!q) return true;
      return [a.first_name + ' ' + a.last_name, a.company_name, a.institution, a.reference, a.email, a.plan]
        .some(v => v && String(v).toLowerCase().includes(q));
    });

    $('#count').textContent = apps.length + (apps.length === 1 ? ' application' : ' applications');
    $('#list').innerHTML = apps.length ? apps.map(a => {
      const who = a.company_name || a.institution || '';
      const open = !['activated','declined','withdrawn'].includes(a.status);
      const age = days(a.created_at);
      const twins = (byEmail[(a.email || '').trim().toLowerCase()] || []).filter(x => x.id !== a.id);
      const stuck = a.progress && a.progress.state === 'needs_attention';
      const flags = [
        open && age >= 7 ? `<span class="flag flag-age">Open ${age} days</span>` : '',
        twins.length ? `<span class="flag flag-dup">Same applicant as ${esc(twins.map(t => t.reference).join(', '))}</span>` : '',
        a.wants_registered_address ? '<span class="flag flag-reg">Registered address</span>' : ''
      ].join('');
      return `
      <div class="row px-4 py-3 ${a.id === currentId ? 'sel' : ''}" data-id="${a.id}" role="button" tabindex="0">
        <div class="flex items-start justify-between gap-2">
          <span class="font-semibold text-[15px] leading-snug text-gray-900 min-w-0 break-words">${esc(a.first_name)} ${esc(a.last_name)}</span>
          <span class="pill s-${a.status} shrink-0 whitespace-nowrap">${STATUS_LABELS[a.status]||a.status}</span>
        </div>
        <div class="text-[13px] text-gray-600 mt-0.5">${esc(a.plan)}${who ? ' &middot; ' + esc(who) : ''}</div>
        ${a.progress ? `
        <div class="mt-2">
          <div class="prog-track"><div class="prog-fill ${stuck ? 'warn' : ''}" style="width:${Math.round(100*a.progress.done/a.progress.total)}%"></div></div>
          <div class="text-[13px] mt-1.5 ${stuck ? 'text-red-700 font-semibold' : 'text-gray-700 font-medium'}">
            ${stuck ? 'Needs attention' : (a.progress.next ? 'Next: ' + esc(a.progress.next) : 'Complete')}
            <span class="text-gray-400 font-normal">&middot; ${a.progress.done}/${a.progress.total}</span>
          </div>
        </div>` : ''}
        ${flags ? `<div class="flex flex-wrap gap-1.5 mt-2">${flags}</div>` : ''}
        <div class="text-xs text-gray-400 mt-1.5">${esc(a.reference)} &middot; ${fmt(a.created_at)}</div>
      </div>`; }).join('')
      : `<div class="px-4 py-10 text-center text-sm text-gray-500">${q ? 'Nothing matches that search.' : 'Nothing in this queue.'}</div>`;
  }

  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('[data-view]'); if(!c) return;
    const was = view; view = c.dataset.view;
    // Moving between the open views needs no round trip.
    if(HISTORY.includes(view) || HISTORY.includes(was)){ renderQueue(); loadQueue().catch(()=>{}); }
    else renderQueue();
  });
  $('#search').addEventListener('input', renderQueue);
  $('#list').addEventListener('click', e => { const r = e.target.closest('.row'); if(r) openDetail(r.dataset.id, true); });
  $('#list').addEventListener('keydown', e => { if(e.key === 'Enter'){ const r = e.target.closest('.row'); if(r) openDetail(r.dataset.id, true); } });
  $('#refresh').addEventListener('click', async () => {
    const b = $('#refresh'); b.disabled = true; b.textContent = 'Refreshing…';
    try{ await loadQueue(); } catch(e){} finally { b.disabled = false; b.textContent = 'Refresh'; }
  });
  // Coming back to the tab after a while: the queue has probably moved on.
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && !$('#app').hidden && lastLoad && Date.now() - lastLoad > 120000) loadQueue().catch(()=>{});
  });

  // On a phone an application takes over the screen. It is a real history
  // entry, so the phone's own back button returns to the queue.
  function closeDetail(){
    document.body.classList.remove('viewing');
    currentId = null;
    Array.from(document.querySelectorAll('.row.sel')).forEach(r => r.classList.remove('sel'));
    if(isPhone()) window.scrollTo(0, queueScroll);
  }
  window.addEventListener('popstate', () => {
    const id = (location.hash.match(/^#a=(.+)$/) || [])[1];
    if(id) openDetail(decodeURIComponent(id)); else closeDetail();
  });

  // ---- detail ----
  function field(label, value){
    if(!value && value !== false) return '';
    const v = value === true ? 'Yes' : value === false ? 'No' : value;
    return `<div><dt class="text-xs font-semibold text-gray-500 uppercase tracking-wide">${label}</dt>
            <dd class="text-sm text-gray-900 mt-0.5">${esc(v)}</dd></div>`;
  }

  // fresh = the user just picked it from the queue (as opposed to a re-render
  // after an action, which must not move the page or add history).
  const BACKBAR = '<button type="button" class="backbar" data-back>&#8249; Back to queue</button>';
  const waNumber = p => { let d = String(p || '').replace(/\D/g, ''); if(d.startsWith('0')) d = '27' + d.slice(1); return d; };

  async function openDetail(id, fresh){
    if(fresh){
      if(!document.body.classList.contains('viewing')) queueScroll = window.scrollY;
      const hash = '#a=' + encodeURIComponent(id);
      if(location.hash !== hash){
        if(document.body.classList.contains('viewing') || !isPhone()) history.replaceState(null, '', hash);
        else history.pushState(null, '', hash);
      }
    }
    const samePane = currentId === id && !fresh;
    currentId = id;
    document.body.classList.add('viewing');
    Array.from(document.querySelectorAll('.row')).forEach(r => r.classList.toggle('sel', r.dataset.id === id));
    $('#detail').className = 'card p-4 sm:p-7 text-sm text-left min-w-0';
    if(!samePane){
      $('#detail').innerHTML = BACKBAR + '<div class="p-8 text-center text-sm text-gray-500">Loading…</div>';
      if(isPhone()) window.scrollTo(0, 0);
    }

    const data = await api('staff-applications?id=' + encodeURIComponent(id));
    if(!data) return;
    cache[id] = data;
    const a = data.application;
    const isVO = a.type === 'virtual_office';

    // Each document is signed when it is clicked, not now, so a link can
    // never have expired by the time it is used.
    // A document can only be ticked once somebody has opened or downloaded
    // it: the history shows that, and so does this session.
    const seen = new Set(data.events
      .filter(e => e.event_type === 'document_viewed' || e.event_type === 'document_downloaded')
      .map(e => e.detail && e.detail.doc_type));
    const locked = a.status === 'approved' || a.status === 'activated';
    const allTicked = data.documents.length > 0 && data.documents.every(d => d.verified === true);

    const docs = data.documents.map(d => `
      <div class="flex flex-wrap items-center gap-2 px-3 py-2.5 rounded-lg border border-[#E8D9C5] hover:bg-[#FAF8F6]" data-doctype="${esc(d.doc_type)}">
        <button type="button" data-doc="${esc(d.id)}" class="basis-full sm:basis-0 sm:flex-1 min-w-0 text-left">
          <span class="block text-sm font-medium text-[#6B4423]">${DOC_LABELS[d.doc_type]||d.doc_type}</span>
          <span class="block text-xs text-gray-400 truncate">${esc(d.original_filename||'')}</span>
        </button>
        <button type="button" data-doc="${esc(d.id)}" class="btn btn-ghost shrink-0" style="padding:.35rem .8rem">Open</button>
        <button type="button" data-dl="${esc(d.id)}" class="btn btn-ghost shrink-0" style="padding:.35rem .8rem">Download</button>
        <label class="tick shrink-0 ml-auto ${d.verified ? 'on' : ''}" title="${seen.has(d.doc_type) || d.verified ? 'Tick once you have read it' : 'Open or download it first'}">
          <input type="checkbox" data-verify="${esc(d.id)}" ${d.verified ? 'checked' : ''} ${locked || !(seen.has(d.doc_type) || d.verified) ? 'disabled' : ''}>
          Checked
        </label>
      </div>`).join('') || '<p class="text-sm text-gray-500">No documents.</p>';

    const events = data.events.map(e => `
      <li class="flex gap-3 text-xs">
        <span class="text-gray-400 shrink-0 w-24 sm:w-28">${fmt(e.created_at)}</span>
        <span class="text-gray-700"><strong>${esc(e.event_type)}</strong>
        ${e.actor ? ' &middot; ' + esc(e.actor) : ''}
        ${e.detail && e.detail.message ? '<br><span class="text-gray-500">'+esc(e.detail.message)+'</span>' : ''}</span>
      </li>`).join('');

    const wa = waNumber(a.phone);
    $('#detail').innerHTML = BACKBAR + `
      <div class="flex items-start justify-between gap-x-4 gap-y-1 flex-wrap">
        <div class="min-w-0">
          <div class="flex items-center gap-x-3 gap-y-1 flex-wrap">
            <h2 class="text-xl font-extrabold text-gray-900">${esc(a.first_name)} ${esc(a.last_name)}</h2>
            <span class="pill s-${a.status}">${STATUS_LABELS[a.status]||a.status}</span>
          </div>
          <p class="text-sm text-gray-600 mt-1">${esc(a.plan)} &middot; ${esc(a.reference)}</p>
        </div>
        <div class="sm:text-right text-xs text-gray-500">
          Applied ${fmt(a.created_at)}${a.reviewed_at ? '<br>Last action '+fmt(a.reviewed_at) : ''}
        </div>
      </div>

      <div class="contact mt-4">
        ${a.phone ? `<a href="tel:${esc(String(a.phone).replace(/[^\d+]/g,''))}">Call</a>` : ''}
        ${wa.length >= 10 ? `<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${a.email ? `<a href="mailto:${esc(a.email)}?subject=${encodeURIComponent('Your Village Hub application ' + (a.reference || ''))}">Email</a>` : ''}
      </div>

      ${renderProgress(data.progress)}

      ${a.wants_registered_address ? `
        <div class="mt-4 p-3 rounded-lg text-sm" style="background:#fdf6e7;border-left:3px solid var(--vh-gold)">
          <strong class="text-gray-900">Registered CIPC / SARS address requested.</strong>
          Confirm the head lease permits third-party registered-address use before approving.
        </div>` : ''}

      <dl class="grid grid-cols-2 gap-x-4 gap-y-4 mt-5 [&_dd]:break-words">
        ${field('Email', a.email)}
        ${field('Phone', a.phone)}
        ${field('Preferred start', a.preferred_start_date)}
        ${isVO ? field('Company', a.company_name) : field('Institution', a.institution)}
        ${isVO ? field('Trading name', a.company_trading_name) : field('Student number', a.student_number)}
        ${isVO ? field('Structure', a.company_type) : field('Studying', a.course_of_study)}
        ${isVO ? field('CIPC number', a.cipc_registration_number) : field('Year', a.year_of_study)}
        ${isVO ? field('VAT number', a.vat_number) : field('Lives at Nooitgedacht', a.is_nooitgedacht_resident)}
        ${isVO ? field('Director / owner', a.director_full_name) : field('Area', a.residence_area)}
        ${isVO ? field('Role', a.director_role) : ''}
        ${isVO ? field('Website', a.website) : ''}
        ${isVO ? field('Expected post', a.expected_mail_volume) : ''}
      </dl>
      ${isVO && a.business_activity ? `<div class="mt-4">${field('What the business does', a.business_activity)}</div>` : ''}

      <h3 class="text-sm font-bold text-gray-900 mt-7 mb-2">Documents</h3>
      <div class="space-y-2">${docs}</div>
      <p class="text-xs text-gray-400 mt-2">Open reads it in a new tab, Download saves it. Both are logged against the application. Tick <strong>Checked</strong> on each one after reading it: Approve stays locked until all are ticked.</p>
      ${a.type === 'virtual_office' ? renderVetting(a) : ''}

      ${a.internal_notes ? `<h3 class="text-sm font-bold text-gray-900 mt-7 mb-2">Internal notes</h3>
        <pre class="text-xs text-gray-700 whitespace-pre-wrap bg-[#FAF8F6] p-3 rounded-lg border border-[#E8D9C5]">${esc(a.internal_notes)}</pre>` : ''}

      <h3 class="text-sm font-bold text-gray-900 mt-7 mb-2">Actions</h3>
      <textarea class="field" id="msg" rows="3" placeholder="Message to the applicant (required to request information or decline). This text goes into the email."></textarea>

      <div class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2 mt-3">
        ${a.status === 'submitted' ? '<button class="btn btn-ghost" data-act="take">Take this one</button>' : ''}
        <button class="btn btn-ghost"  data-act="request_info">Request information</button>
        ${locked ? '' : `<button class="btn btn-sage col-span-2 order-first sm:order-none" data-act="approve" ${allTicked && (a.type !== 'virtual_office' || vetOk(a)) ? '' : 'disabled title="Tick every document and record the WinDeed company check first"'}>Approve${data.automation === 'live' ? ' and set up' : ''}</button>`}
        <button class="btn btn-danger" data-act="decline">Decline</button>
        <button class="btn btn-ghost"  data-act="note">Add note only</button>
      </div>
      ${!locked && !allTicked ? '<p class="text-xs text-gray-500 mt-2">Approve unlocks once every document above is ticked as checked.</p>' : ''}
      <p id="actionMsg" class="text-sm mt-3" role="status"></p>

      ${a.status === 'approved' ? renderAutomation(a, data) + `
        <details class="mt-3" ${data.automation === 'live' && data.progress.state !== 'needs_attention' ? '' : 'open'}>
          <summary class="text-xs font-semibold text-gray-600 cursor-pointer">${data.automation === 'live' ? 'Set up by hand instead' : 'Set up in Spacebring by hand'}</summary>
        <div class="mt-5 p-4 rounded-lg" style="background:#FAF8F6;border:1px solid var(--vh-sand)">
          <p class="text-sm font-bold text-gray-900">Now create the subscription in Spacebring</p>
          <p class="text-xs text-gray-600 mt-1 mb-3">Create the customer and the <strong>${esc(a.plan)}</strong> subscription in Spacebring, let it raise the invoice, then record the references here so the loop is closed.</p>
          <div class="grid sm:grid-cols-2 gap-2">
            <input class="field" autocapitalize="off" autocorrect="off" id="sbCustomer" placeholder="Spacebring customer ref">
            <input class="field" id="sbSub" placeholder="Spacebring subscription ref">
          </div>
          <button class="btn btn-brown mt-3" data-act="activate">Mark as activated</button>
        </div>
        </details>` : ''}

      ${a.spacebring_subscription_ref ? `<p class="text-xs text-gray-500 mt-4">Spacebring subscription: ${esc(a.spacebring_subscription_ref)}</p>` : ''}

      <h3 class="text-sm font-bold text-gray-900 mt-7 mb-2">History</h3>
      <ul class="space-y-1.5">${events}</ul>
    `;

    const back = $('#detail [data-back]');
    if(back) back.addEventListener('click', () => {
      if(/^#a=/.test(location.hash) && history.length > 1) history.back();
      else { history.replaceState(null, '', location.pathname); closeDetail(); }
    });

    Array.from(document.querySelectorAll('[data-act]')).forEach(b => {
      b.addEventListener('click', () => doAction(b.dataset.act, b));
    });
    Array.from(document.querySelectorAll('[data-doc]')).forEach(b => {
      b.addEventListener('click', () => openDoc(b.dataset.doc, b));
    });
    Array.from(document.querySelectorAll('[data-dl]')).forEach(b => {
      b.addEventListener('click', () => downloadDoc(b.dataset.dl, b));
    });
    Array.from(document.querySelectorAll('[data-verify]')).forEach(c => {
      c.addEventListener('change', () => verifyDoc(c.dataset.verify, c));
    });
    const vs = document.getElementById('vet-save');
    if(vs) vs.addEventListener('click', saveVetting);
    const vc = document.getElementById('vet-copy');
    if(vc) vc.addEventListener('click', () => {
      navigator.clipboard.writeText(vc.dataset.reg).then(() => { vc.textContent = 'Copied'; });
    });
  }

  function vetOk(a){
    const v = a.vetting;
    return !!(v && v.cipc_name && v.company_active === true && v.director_listed === true);
  }

  // The registry check. Staff run a Company search in Lexis WinDeed by
  // registration number and record what the register says.
  function renderVetting(a){
    const v = a.vetting || {};
    const done = !!a.vetting;
    const ok = vetOk(a);
    const live = a.status === 'activated';
    const mismatch = done && v.cipc_name.trim().toLowerCase() !== String(a.company_name || '').trim().toLowerCase();
    const yn = (name, val) => `
      <label class="tick"><input type="radio" name="${name}" value="yes" ${val === true ? 'checked' : ''} ${live ? 'disabled' : ''}> Yes</label>
      <label class="tick"><input type="radio" name="${name}" value="no" ${val === false ? 'checked' : ''} ${live ? 'disabled' : ''}> No</label>`;
    return `
      <div class="mt-5 p-4 rounded-lg" style="background:#FAF8F6;border:1px solid var(--vh-sand);border-left:3px solid ${done ? (ok ? '#8A9A5B' : '#B4472E') : '#C9A24B'}">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-gray-900 uppercase tracking-wide">Company vetting (Lexis WinDeed)</span>
          <span class="text-xs font-semibold ${done ? (ok ? 'text-green-700' : 'text-red-700') : 'text-amber-700'}">${done ? (ok ? 'Passed' : 'Failed') : 'Not done'}</span>
        </div>
        <ol class="text-sm text-gray-700 mt-2 ml-5 list-decimal space-y-1">
          <li>Open <a class="underline text-[#6B4423]" href="https://search.windeed.co.za" target="_blank" rel="noopener">WinDeed</a>, choose Person, then Company.</li>
          <li>Search by registration number: <strong>${esc(a.cipc_registration_number || 'not given')}</strong>
            ${a.cipc_registration_number ? `<button type="button" id="vet-copy" data-reg="${esc(a.cipc_registration_number)}" class="btn btn-ghost" style="padding:.15rem .6rem;font-size:11px">Copy</button>` : ''}</li>
          <li>Record what the report shows. Applicant: <strong>${esc(a.director_full_name || (a.first_name + ' ' + a.last_name))}</strong>.</li>
        </ol>
        <div class="mt-3">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Company name exactly as on the register</label>
          <input id="vet-name" class="field w-full border border-[#E8D9C5]" value="${esc(v.cipc_name || '')}" placeholder="${esc(a.company_name || '')}" ${live ? 'disabled' : ''}>
          ${mismatch ? `<p class="text-xs text-amber-700 mt-1">Differs from the form ("${esc(a.company_name)}"). The registered name will be used on the agreement and invoice.</p>` : ''}
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
          <span class="flex items-center gap-3">Company status is in business? ${yn('vet-active', v.company_active)}</span>
          <span class="flex items-center gap-3">Applicant is an active director? ${yn('vet-director', v.director_listed)}</span>
        </div>
        <div class="mt-3">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Notes (optional): other directors, anything unusual</label>
          <input id="vet-notes" class="field w-full border border-[#E8D9C5]" value="${esc(v.notes || '')}" ${live ? 'disabled' : ''}>
        </div>
        ${live ? '' : `<button type="button" id="vet-save" class="btn btn-brown mt-3">${done ? 'Update the check' : 'Save the check'}</button>`}
        <p id="vet-msg" class="text-xs mt-2 ${done ? 'text-gray-500' : 'hidden'}">${done ? 'Recorded by ' + esc(v.checked_by) + ' on ' + fmt(v.checked_at) + '. Save the WinDeed report to the client folder.' : ''}</p>
      </div>`;
  }

  async function saveVetting(){
    const pick = n => { const r = document.querySelector('input[name="'+n+'"]:checked'); return r ? r.value === 'yes' : null; };
    const msg = document.getElementById('vet-msg');
    const body = {
      application_id: currentId, action: 'save_vetting',
      cipc_name: document.getElementById('vet-name').value.trim(),
      company_active: pick('vet-active'), director_listed: pick('vet-director'),
      notes: document.getElementById('vet-notes').value.trim(),
    };
    msg.className = 'text-xs mt-2 text-gray-500'; msg.textContent = 'Saving...';
    try{
      const res = await api('application-action', { method:'POST', body: JSON.stringify(body) });
      if(!res) return;
      await openDetail(currentId);
    }catch(e){
      msg.className = 'text-xs mt-2 text-red-700'; msg.textContent = e.message || 'That did not save.';
    }
  }

  // The bar across the top of an application: every stage from application
  // to the mail desk being told, with the date each one happened.
  function renderProgress(p){
    if(!p || !p.stages) return '';
    const stuck = p.state === 'needs_attention';
    return `
      <div class="mt-5 p-4 rounded-lg" style="background:#FAF8F6;border:1px solid var(--vh-sand)">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold text-gray-900 uppercase tracking-wide">Onboarding progress</span>
          <span class="text-xs ${stuck ? 'text-red-700 font-semibold' : 'text-gray-500'}">${stuck ? 'Needs attention' : p.done + ' of ' + p.total + ' done'}</span>
        </div>
        <div class="steps">
          ${p.stages.map(st => `
            <div class="step ${st.done ? 'done' : ''} ${st.current ? (stuck ? 'stuck current' : 'current') : ''}">
              ${st.done ? '&#10003; ' : ''}${esc(st.label)}
              ${st.at ? '<small>' + fmt(st.at) + '</small>' : ''}
            </div>`).join('')}
        </div>
      </div>`;
  }

  // What the automation is doing with an approved application.
  function renderAutomation(a, data){
    const p = data.progress || {};
    if(data.automation === 'off' && !p.state) return '';
    const box = (bg, border, html) => `<div class="mt-5 p-4 rounded-lg text-sm" style="background:${bg};border-left:3px solid ${border}">${html}</div>`;
    if(p.state === 'needs_attention' && p.error){
      return box('#fdecea', '#B4472E', `
        <strong class="text-gray-900">Automatic set-up stopped at: ${esc(p.error.step)}</strong>
        <p class="text-gray-700 mt-1">${esc(p.error.message)}</p>
        <p class="text-xs text-gray-600 mt-2">Everything before this step is done and will not be repeated.</p>
        <button class="btn btn-brown mt-3" data-act="retry_onboarding">Retry set-up</button>`);
    }
    if(p.state === 'dry_run'){
      return box('#fdf6e7', '#C9A24B', `<strong class="text-gray-900">Not set up yet: this was approved in test mode.</strong> The steps were worked out but nothing was sent to Spacebring and the client has no account, agreement or invoice.
        ${data.automation === 'live'
          ? '<button class="btn btn-brown mt-3 block" data-act="retry_onboarding">Run the automatic set-up now</button>'
          : ' Set this client up by hand below, or switch the automation to live.'}`);
    }
    if(p.state === 'in_progress'){
      const next = (p.stages.find(x => x.current) || {}).label || '';
      return box('#eef3e6', '#8A9A5B', `<strong class="text-gray-900">Set-up is running automatically.</strong> Waiting on: ${esc(next)}. This page updates every 15 minutes; nothing needs doing unless it stalls.`);
    }
    if(!p.state && data.automation !== 'off'){
      return box('#fdf6e7', '#C9A24B', `<strong class="text-gray-900">Approved before the automation was switched on.</strong>
        <button class="btn btn-brown mt-3 block" data-act="retry_onboarding">Run the automatic set-up now</button>`);
    }
    return '';
  }

  async function verifyDoc(docId, box){
    box.disabled = true;
    try{
      const res = await api('application-action', { method:'POST', body: JSON.stringify({
        application_id: currentId, action:'verify_doc', document_id: docId, verified: box.checked }) });
      if(!res) return;
      await openDetail(currentId);
    }catch(e){
      box.checked = !box.checked; box.disabled = false;
      docError(e.message || 'That tick did not save.');
    }
  }

  // Opening or downloading a document unlocks its tick straight away.
  function unlockTick(docId){
    const c = document.querySelector('[data-verify="'+docId+'"]');
    if(c && !c.checked && !['approved','activated'].includes((cache[currentId]||{application:{}}).application.status)){
      c.disabled = false; c.parentElement.title = 'Tick once you have read it';
    }
  }

  function docError(message){
    const m = $('#actionMsg');
    if(m){ m.className = 'text-sm mt-3 text-red-700'; m.textContent = message; m.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  }

  // Opens the document in its own tab, leaving this page exactly as it was.
  //
  // The blank tab must be opened synchronously inside the click — open it
  // after the await and the browser calls it an unrequested pop-up and blocks
  // it. It must also be opened WITHOUT 'noopener': that feature makes
  // window.open return null, which left an orphaned blank tab sitting there
  // while the fallback navigated this page to the document instead.
  async function openDoc(docId, btn){
    const tab = window.open('about:blank', '_blank');
    if(tab){
      // Something to look at for the second the signature takes.
      try{
        tab.document.write('<!doctype html><title>Opening…</title>' +
          '<body style="margin:0;display:grid;place-items:center;height:100vh;' +
          'font:500 14px/1.5 system-ui,sans-serif;color:#6B4423;background:#FAF8F6">Opening the document…</body>');
        tab.document.close();
      }catch(e){}
    }
    btn.disabled = true;
    try{
      const data = await api('staff-applications?doc=' + encodeURIComponent(docId));
      if(!data || !data.view_url) throw new Error('No link came back');
      if(tab){ tab.location.href = data.view_url; unlockTick(docId); }
      else { docError('Allow pop-ups for this site, or use Download instead.'); }
    }catch(e){
      if(tab) tab.close();
      docError(e.message || 'That document would not open.');
    }finally{
      btn.disabled = false;
    }
  }

  // Saves the file under the name the applicant uploaded.
  //
  // The file is pulled down and handed to the browser as a blob rather than
  // pointing a link at storage. Deliberate: a cross-origin link relies on the
  // server sending Content-Disposition: attachment, and if it ever did not,
  // the click would navigate this page to the document — the very thing we
  // just stopped happening. A blob URL is same-origin, so the download
  // attribute is honoured, the filename is exact, and this page cannot move.
  async function downloadDoc(docId, btn){
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving…';
    let objectUrl = null;
    try{
      const data = await api('staff-applications?download=1&doc=' + encodeURIComponent(docId));
      if(!data || !data.view_url) throw new Error('No link came back');

      const res = await fetch(data.view_url);
      if(!res.ok) throw new Error('Storage would not release that file');
      const blob = await res.blob();

      objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = data.filename || 'document';
      document.body.appendChild(a);
      a.click();
      a.remove();
      unlockTick(docId);
    }catch(e){
      docError(e.message || 'That document would not download.');
    }finally{
      if(objectUrl) setTimeout(() => URL.revokeObjectURL(objectUrl), 20000);
      btn.disabled = false; btn.textContent = original;
    }
  }

  async function doAction(action, btn){
    const msgEl = $('#actionMsg');
    const message = ($('#msg') && $('#msg').value.trim()) || '';

    if((action === 'decline' || action === 'request_info' || action === 'note') && !message){
      msgEl.className = 'text-sm mt-4 text-red-700';
      msgEl.textContent = action === 'decline'
        ? 'Give the applicant a reason. A decline with no reason is worse than no reply.'
        : 'Write the message first.';
      return;
    }
    if(action === 'decline' && !confirm('Decline this application and email the applicant?')) return;
    const live = (cache[currentId]||{}).automation === 'live';
    if(action === 'approve' && live && !confirm('Approve and set this client up in Spacebring? The client is emailed, invited to the app and sent their agreement or invoice.')) return;
    if(action === 'retry_onboarding' && live && !confirm('Run the Spacebring set-up for this client now?')) return;

    Array.from(document.querySelectorAll('[data-act]')).forEach(b => b.disabled = true);
    msgEl.className = 'text-sm mt-4 text-gray-600';
    msgEl.textContent = 'Working…';

    try{
      const body = { application_id: currentId, action, message };
      if(action === 'activate'){
        body.spacebring_customer_ref = ($('#sbCustomer')||{}).value || '';
        body.spacebring_subscription_ref = ($('#sbSub')||{}).value || '';
      }
      const res = await api('application-action', { method:'POST', body: JSON.stringify(body) });
      if(!res) return;
      await loadQueue();
      await openDetail(currentId);
      const after = $('#actionMsg');
      after.className = 'text-sm mt-4 ' + (res.emailed === false && action !== 'take' && action !== 'note' && action !== 'activate' ? 'text-amber-700' : 'text-green-700');
      after.textContent = (res.emailed === false && ['approve','decline','request_info'].includes(action))
        ? 'Saved, but the email did NOT go out. Contact the applicant yourself.'
        : (res.onboarding && res.onboarding.state === 'needs_attention')
          ? 'Saved, but the automatic set-up stopped. See the red box above.'
          : 'Done.';
      if(res.onboarding && res.onboarding.state === 'needs_attention') after.className = 'text-sm mt-4 text-amber-700';
    }catch(e){
      msgEl.className = 'text-sm mt-4 text-red-700';
      msgEl.textContent = e.message || 'That did not work.';
      Array.from(document.querySelectorAll('[data-act]')).forEach(b => b.disabled = false);
    }
  }

  // ---- boot ----
  // A stored refresh token means no sign-in screen at all: the access token
  // is renewed in the background on the first request.
  if(Auth.hasSession()){ bootApp(); }
  // A reload, or a link shared between staff, lands back on the same application.
  const deep = (location.hash.match(/^#a=(.+)$/) || [])[1];
  if(deep && Auth.hasSession()) openDetail(decodeURIComponent(deep)).catch(()=>{});
})();
</script>
</body>
</html>
