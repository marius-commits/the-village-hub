<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads | The Village Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Design tokens and base components only. vh.js is deliberately NOT loaded:
       the public nav, footer, page transitions and WhatsApp nudge do not belong
       on a staff tool that displays identity documents. -->
  <link rel="stylesheet" href="/assets/vh.css?v=3">
  <script src="/assets/vh-admin-auth.js?v=2"></script>
  <style>
    body{ background:var(--vh-linen); font-family:var(--vh-sans); }
    .btn{ border-radius:999px; font-weight:600; font-size:14px; padding:.6rem 1.2rem; }
    .btn:disabled{ opacity:.5; cursor:not-allowed; }
    .btn-sage{ background:var(--vh-sage); color:#fff; }
    .btn-brown{ background:var(--vh-bark); color:#fff; }
    .btn-ghost{ background:#fff; color:var(--vh-bark); border:1px solid var(--vh-sand); }
    .btn-danger{ background:#fff; color:#b03a2b; border:1px solid #e8c4bd; }
    .card{ background:#fff; border:1px solid var(--vh-sand); border-radius:12px; }
    .field{ padding:.6rem .85rem; font-size:14px; border-radius:.6rem; }
    .pill{ display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:99px; }
    .s-new{ background:#eef3e4; color:#5c6b36; }
    .s-contacted{ background:#e7eefb; color:#2f5597; }
    .s-viewing_booked{ background:#fdf3e0; color:#8a6116; }
    .s-quoted{ background:#f3e8fb; color:#6a2f97; }
    .s-won{ background:#e6f4ea; color:#1e7c3a; }
    .s-lost{ background:#fbeae7; color:#b03a2b; }
    .tab{ padding:.5rem .9rem; border-radius:999px; font-size:14px; font-weight:600; color:var(--vh-bark); text-decoration:none; }
    .tab.on{ background:var(--vh-bark); color:#fff; }
    [hidden]{ display:none !important; }
  </style>
</head>
<body class="font-sans antialiased text-gray-800">

<!-- ===== LOGIN ===== -->
<div id="login" class="min-h-screen flex items-center justify-center px-4">
  <div class="card p-8 w-full max-w-sm">
    <div class="flex items-center mb-6">
      <img class="h-10 w-10 object-contain" src="/images/web/logo.png" alt="">
      <span class="ml-3 font-bold text-[#6B4423] font-display">The Village Hub</span>
    </div>
    <h1 class="text-xl font-extrabold text-gray-900 font-display">Leads</h1>
    <p class="text-sm text-gray-600 mt-1 mb-5">Staff only. We email you a one-time sign-in code, then this device stays signed in.</p>
    <div id="step-email">
      <label class="block text-xs font-semibold text-gray-700 mb-1" for="loginEmail">Work email</label>
      <input class="field" id="loginEmail" type="email" placeholder="you@villagehub.co.za" autocomplete="email">
      <button class="btn btn-sage w-full mt-4" id="sendLink">Email me a code</button>
    </div>
    <div id="step-code" hidden>
      <label class="block text-xs font-semibold text-gray-700 mb-1" for="loginCode">Enter the code</label>
      <input class="field text-center text-lg" style="letter-spacing:.4em" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="--------">
      <button class="btn btn-sage w-full mt-4" id="verifyCode">Sign in</button>
      <button class="text-xs text-[#6B4423] underline mt-3 mx-auto block" id="resend" type="button">Use a different email</button>
    </div>
    <p class="text-sm mt-4" id="loginMsg"></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header class="bg-white border-b border-[#E8D9C5] sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center">
        <img class="h-8 w-8 object-contain" src="/images/web/logo.png" alt="">
        <span class="ml-2 font-bold text-[#6B4423] text-sm font-display hidden sm:inline">Admin</span>
      </div>
      <nav class="flex items-center gap-1">
        <a class="tab" href="/admin/dashboard">Dashboard</a>
        <a class="tab" href="/admin/applications">Apps</a>
        <span class="tab on">Leads</span>
      </nav>
      <button class="text-xs text-[#6B4423] underline" id="signout">Sign out</button>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-3 py-4">
    <div class="flex items-center justify-between gap-2 mb-3">
      <select class="field text-sm py-2 w-auto" id="statusFilter">
        <option value="">Open leads</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="viewing_booked">Viewing booked</option>
        <option value="quoted">Quoted</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
        <option value="all">All</option>
      </select>
      <span class="text-xs text-gray-500" id="count"></span>
    </div>
    <div id="list" class="space-y-3"></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  const Auth = window.VHAdminAuth;

  const $ = s => document.querySelector(s);

  const STATUS_LABELS = { new:'New', contacted:'Contacted', viewing_booked:'Viewing booked', quoted:'Quoted', won:'Won', lost:'Lost' };
  const BUTTONS = ['contacted','viewing_booked','won','lost'];
  const PRODUCT_LABELS = { boardroom:'Boardroom', meeting_room:'Meeting room', hot_desk:'Desk', private_office:'Private office', virtual_office:'Virtual office', student:'Student', village_stay:'Village stay', event:'Event', other:'Other' };
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = d => d ? new Date(d).toLocaleString('en-ZA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';

  // ---- auth ----
  // The session itself lives in /assets/vh-admin-auth.js: refresh token kept
  // and rotated, so signing in is a once-a-month event rather than a daily tax.
  let pendingEmail = null;

  function showLogin(message){
    $('#app').hidden = true; $('#login').hidden = false;
    $('#step-code').hidden = true; $('#step-email').hidden = false;
    $('#loginMsg').className = 'text-sm mt-4 ' + (message ? 'text-red-700' : 'text-gray-700');
    $('#loginMsg').textContent = message || '';
  }

  function bootApp(){
    $('#login').hidden = true;
    $('#app').hidden = false;
    loadQueue().catch(err => showLogin(err && err.authRequired
      ? 'That session has ended. Sign in again.'
      : 'Could not load leads. Reload the page.'));
  }

  $('#sendLink').addEventListener('click', async () => {
    const email = $('#loginEmail').value.trim();
    const msg = $('#loginMsg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.className='text-sm mt-4 text-red-700'; msg.textContent='That email does not look right.'; return; }
    $('#sendLink').disabled = true;
    msg.className='text-sm mt-4 text-gray-600'; msg.textContent='Sending…';
    try{
      await Auth.requestCode(email);
      pendingEmail = email;
      $('#step-email').hidden = true; $('#step-code').hidden = false;
      msg.className='text-sm mt-4 text-gray-700';
      msg.textContent='We emailed a sign-in code to ' + email + '. It is a number — there is no link to click.';
      const c = $('#loginCode'); if(c) c.focus();
    }catch(e){
      msg.className='text-sm mt-4 text-red-700';
      msg.textContent = e.message || 'Could not send that code.';
    }finally{
      $('#sendLink').disabled = false;
    }
  });

  async function verifyCode(){
    const code = ($('#loginCode').value||'').replace(/\s/g,'');
    const msg = $('#loginMsg');
    if(!/^\d{6,8}$/.test(code)){ msg.className='text-sm mt-4 text-red-700'; msg.textContent='Enter the code from the email.'; return; }
    $('#verifyCode').disabled = true;
    msg.className='text-sm mt-4 text-gray-600'; msg.textContent='Checking…';
    try{
      await Auth.verifyCode(pendingEmail, code);
      msg.textContent='';
      bootApp();
    }catch(e){
      msg.className='text-sm mt-4 text-red-700';
      msg.textContent = (e.message || 'That code did not work') + '. Check it, or resend.';
    }finally{
      $('#verifyCode').disabled = false;
    }
  }
  $('#verifyCode').addEventListener('click', verifyCode);
  $('#loginCode').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); verifyCode(); } });
  $('#resend').addEventListener('click', () => { $('#step-code').hidden=true; $('#step-email').hidden=false; $('#loginCode').value=''; $('#loginMsg').textContent=''; });

  $('#signout').addEventListener('click', () => { Auth.signOut(); location.reload(); });

  async function api(path, options){
    try{ return await Auth.api(path, options); }
    catch(e){ if(e && e.authRequired){ showLogin('Your session has ended. Sign in again.'); return null; } throw e; }
  }

  let leads = [];
  async function loadQueue(){
    const s = $('#statusFilter').value;
    const data = await api('staff-leads' + (s ? '?status=' + s : ''));
    if(!data) return;
    leads = data.leads || [];
    render();
  }

  function ago(d){
    const m = Math.round((Date.now() - new Date(d)) / 60000);
    if(m < 60) return m + ' min ago';
    if(m < 1440) return Math.round(m/60) + ' h ago';
    return Math.round(m/1440) + ' d ago';
  }

  function card(l){
    const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || l.phone;
    const wa = l.phone ? 'https://wa.me/' + l.phone.replace(/\D/g,'').replace(/^0/,'27') : null;
    const src = l.gclid ? 'Google Ads' : (l.utm_source ? l.utm_source + (l.utm_campaign ? ' / ' + l.utm_campaign : '') : (l.source_detail || l.source));
    const btns = BUTTONS.map(s => `<button class="btn ${l.status===s ? 'btn-brown' : 'btn-ghost'} flex-1 min-w-[45%] sm:min-w-0" data-id="${l.id}" data-s="${s}">${STATUS_LABELS[s]}</button>`).join('');
    return `<article class="card p-4" id="L${l.id}">
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="font-bold text-gray-900">${esc(name)}${l.company ? ' <span class="font-normal text-gray-500">· ' + esc(l.company) + '</span>' : ''}</div>
          <div class="text-xs text-gray-500 mt-0.5">${esc(PRODUCT_LABELS[l.product] || l.product)} · ${esc(src)} · ${ago(l.created_at)}</div>
        </div>
        <span class="pill s-${l.status}">${esc(STATUS_LABELS[l.status] || l.status)}</span>
      </div>
      <div class="flex flex-wrap gap-2 mt-3 text-sm">
        ${l.phone ? `<a class="btn btn-ghost" href="tel:${esc(l.phone)}">Call</a>` : ''}
        ${wa ? `<a class="btn btn-sage" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        ${l.email ? `<a class="btn btn-ghost" href="mailto:${esc(l.email)}">Email</a>` : ''}
      </div>
      ${l.message ? `<details class="mt-3 text-sm text-gray-700"><summary class="cursor-pointer text-xs text-[#6B4423]">Message${l.preferred_date ? ' · wants ' + esc(l.preferred_date) : ''}</summary><p class="whitespace-pre-line mt-1">${esc(l.message)}</p></details>` : ''}
      ${l.notes ? `<p class="text-xs text-gray-600 whitespace-pre-line mt-2 border-l-2 border-[#E8D9C5] pl-2">${esc(l.notes)}</p>` : ''}
      <div class="flex flex-wrap gap-2 mt-3">${btns}</div>
      <div class="flex gap-2 mt-2"><input class="field flex-1" placeholder="Add a note" data-note="${l.id}"><button class="btn btn-ghost" data-save="${l.id}">Save</button></div>
    </article>`;
  }

  function render(){
    $('#count').textContent = leads.length + (leads.length === 1 ? ' lead' : ' leads');
    $('#list').innerHTML = leads.length ? leads.map(card).join('') : '<p class="card p-6 text-center text-sm text-gray-500">No leads here.</p>';
  }

  async function update(id, payload){
    const data = await api('staff-leads', { method:'POST', body: JSON.stringify(Object.assign({ id }, payload)) });
    if(!data || !data.lead) return;
    const i = leads.findIndex(x => x.id === id);
    if(i >= 0) leads[i] = Object.assign(leads[i], data.lead);
    render();
  }

  $('#list').addEventListener('click', async e => {
    const b = e.target.closest('button'); if(!b) return;
    try{
      if(b.dataset.s){
        const s = b.dataset.s, payload = { status: s };
        if(s === 'won'){ const v = prompt('Won! Monthly or booking value in rand (optional):', ''); if(v === null) return; if(v.trim()) payload.won_value_zar = v.replace(/[^\d.]/g,''); }
        if(s === 'lost'){ const r = prompt('Why was it lost? (optional)', ''); if(r === null) return; if(r.trim()) payload.lost_reason = r.trim(); }
        b.disabled = true; await update(b.dataset.id, payload);
      } else if(b.dataset.save){
        const inp = document.querySelector('[data-note="' + b.dataset.save + '"]');
        if(!inp.value.trim()) return;
        b.disabled = true; await update(b.dataset.save, { note: inp.value.trim() });
      }
    }catch(err){ alert(err.message || 'Could not save that. Try again.'); b.disabled = false; }
  });
  $('#statusFilter').addEventListener('change', () => loadQueue().catch(() => alert('Could not load leads.')));

  if(Auth.hasSession()){ bootApp(); }
})();
</script>
</body>
</html>
